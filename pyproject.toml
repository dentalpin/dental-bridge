[project]
name = "dental-bridge"
version = "0.1.0"
description = "Open source migration toolkit for dental practice management systems. First connector: Gesdén."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Dentalpin contributors" },
]
keywords = ["dental", "migration", "etl", "gesden", "pms", "healthcare", "odontology"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pyodbc>=5.1.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "zstandard>=0.22.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "faker>=25.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
]
build = [
    "pyinstaller>=6.6.0",
]

[project.scripts]
dental-bridge = "dental_bridge.__main__:main"

[project.entry-points."dental_bridge.adapters"]
gesden = "dental_bridge.adapters.gesden.adapter:GesdenAdapter"
nemodent = "dental_bridge.adapters.nemodent.adapter:NemodentAdapter"

[project.urls]
Homepage = "https://github.com/dentalpin/dental-bridge"
Repository = "https://github.com/dentalpin/dental-bridge"
Issues = "https://github.com/dentalpin/dental-bridge/issues"
Specification = "https://github.com/dentalpin/dental-bridge/blob/main/spec/dpmf-v0.1.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dental_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "src/dental_bridge",
    "spec",
    "docs",
    "README.md",
    "LICENSE",
    "NOTICE.md",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N803"]  # test fn names
"src/dental_bridge/cli/**/*.py" = ["B008"]  # typer.Option in defaults is the typer pattern

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: integration tests requiring Docker SQL Server",
    "windows: tests specific to Windows runtime",
    "slow: tests that take more than a few seconds",
]

[tool.coverage.run]
source = ["src/dental_bridge"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
