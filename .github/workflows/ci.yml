name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint + tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy src/dental_bridge
        continue-on-error: true  # tighten once typing is sweeped

      - name: Pytest (unit)
        run: uv run pytest tests/unit -v

  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (with build extras)
        run: uv sync --all-extras

      - name: Build with PyInstaller
        run: uv run pyinstaller --noconfirm --clean build/dental-bridge.spec

      - name: Smoke test built binary
        run: dist\dental-bridge.exe --version

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\dental-bridge.exe -Algorithm SHA256).Hash
          "$hash *dental-bridge.exe" | Out-File -FilePath dist\dental-bridge.exe.sha256 -Encoding ASCII
          Write-Host "SHA-256: $hash"

      - name: Upload artifact (commit smoke)
        uses: actions/upload-artifact@v4
        with:
          name: dental-bridge-windows-${{ github.sha }}
          path: |
            dist/dental-bridge.exe
            dist/dental-bridge.exe.sha256
          retention-days: 30

  dco-check:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by trailers on PR commits
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: '; then
              echo "::error::commit $sha is missing a Signed-off-by trailer"
              missing=$((missing + 1))
            fi
          done < <(git log --no-merges --format=%H "origin/${GITHUB_BASE_REF}..HEAD")
          exit "$missing"
